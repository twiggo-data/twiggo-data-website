<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Twiggo Data is coming soon.">
  <meta name="theme-color" content="#350b62">
  <title>Twiggo Data | Coming Soon</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background: radial-gradient(ellipse at 50% 33%, #620bbd, #350b62 72%);
      color: #fff;
      font-family: "Arial Nova", Arial, sans-serif;
    }
    main { width: min(100%, 35rem); text-align: center; }
    .brand {
      position: relative;
      width: min(100%, 17rem);
      aspect-ratio: 5.3;
      margin: 0 auto 2rem;
      overflow: hidden;
      border-radius: .45rem;
    }
    .brand img {
      position: absolute;
      width: 116%;
      height: auto;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -49%);
    }
    h1 {
      margin: 0;
      font-size: clamp(2.7rem, 10vw, 6rem);
      letter-spacing: -.055em;
      line-height: 1;
    }
    h1::after {
      content: "";
      display: block;
      width: 2.5rem;
      height: .25rem;
      margin: 1.65rem auto 0;
      border-radius: 1rem;
      background: #b6fd02;
    }
  </style>
</head>
<body>
  <main>
    <div class="brand"><img src="twiggo-data-logo.webp" width="900" height="450" alt="Twiggo Data"></div>
    <h1>Coming soon</h1>
  </main>
</body>
</html>
